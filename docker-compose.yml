services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arkham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arkham_secret}
      POSTGRES_DB: ${POSTGRES_DB:-arkhamdata}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arkham} -d ${POSTGRES_DB:-arkhamdata}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web-build:
    build:
      context: ./web
      dockerfile: Dockerfile.build
    environment:
      API_BASE_URL: http://api:3000
    volumes:
      - web-dist:/app/dist
    depends_on:
      - api
    profiles:
      - build

  web:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - web-dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  postgres-data:
  web-dist:
